    <style>
      html {

      .header-email {

        color: #e9d375;

      .gallery-intro {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: minmax(0, 1fr);

      }

      }
      .gallery {
        box-sizing: border-box;

        align-items: center;

        width: 100%;

        padding: 20px;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        transform: translateY(-30px);
      }
      .pig {
        height: 100%;
        width: auto;
        display: block;
      }
      .gallery::-webkit-scrollbar {
        display: none;
      }
      .gallery-item {
        position: relative;
        box-sizing: border-box;
        flex: 0 0 500px;
        height: 600px;
        cursor: pointer;
        scroll-snap-align: center;
        background-color: #d0bda5;
      }
      .gallery-item-with-image {
        flex: 0 0 auto;
        width: max-content;
      }
      .gallery-caption {
        position: absolute;
        bottom: 20px;
        left: 20px;
        font-family: "roc-grotesk", sans-serif;
        font-weight: 400;
        font-style: normal;
        color: #6e4421;
      }
      .gallery-item-with-image .pictuah {
        width: fit-content;
      }
      .pictuah {
        margin: 20px;
        height: 70%;
        background-color: green;
      }

    <div class="gallery-intro">
      <h2>
        'only acting' is a short film I created in 2025 exploring the casual depravity of the modern man
      </h2>
    
    </div>
    <div>

    </div>
    </main>
    <script>
      const gallery = document.querySelector(".gallery");
      let targetScrollLeft = gallery.scrollLeft;
      let scrollAnimation = null;

      gallery.addEventListener(
        "wheel",
        (event) => {
          const wheelDelta =
            Math.abs(event.deltaX) > Math.abs(event.deltaY)
              ? event.deltaX
              : event.deltaY;

          if (wheelDelta === 0) {
            return;
          }

          event.preventDefault();
          const wheelDistance =
            wheelDelta *
            (event.deltaMode === WheelEvent.DOM_DELTA_LINE
              ? 16
              : event.deltaMode === WheelEvent.DOM_DELTA_PAGE
                ? gallery.clientHeight
                : 1);
          if (scrollAnimation === null) {
            targetScrollLeft = gallery.scrollLeft;
          }
          targetScrollLeft = Math.max(
            0,
            Math.min(
              gallery.scrollWidth - gallery.clientWidth,
              targetScrollLeft + wheelDistance * 0.25,
            ),
          );

          if (scrollAnimation === null) {
            const animateScroll = () => {
              const distance = targetScrollLeft - gallery.scrollLeft;

              if (Math.abs(distance) < 1) {
                gallery.scrollLeft = targetScrollLeft;
                scrollAnimation = null;
                return;
              }

              gallery.scrollLeft += distance * 0.12;
              scrollAnimation = requestAnimationFrame(animateScroll);
            };

            scrollAnimation = requestAnimationFrame(animateScroll);
          }
        },
        { passive: false },
      );
      const headerEmail = document.querySelector(".header-email");
      const emailAddress = headerEmail.textContent.trim();

      async function copyHeaderEmail() {
        try {
          await navigator.clipboard.writeText(emailAddress);
          headerEmail.textContent = "email copied!";
        } catch (error) {
          console.error("Could not copy email address to clipboard.", error);
          headerEmail.textContent = "Unable to copy email";
        }
      }

      headerEmail.addEventListener("click", copyHeaderEmail);
      headerEmail.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          copyHeaderEmail();
        }
      });
    </script>
  </body>

<!doctype html>
<html lang="en">
  <head>
    <style>
      .pig {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        object-fit: cover;
        z-index: -1;
      }
      .block-a {
        display: grid;
      }
      .block-b {
        display: grid;
        align-items: center;
        justify-items: center;
      }
      .block-c {
        display: grid;
        align-items: center;
        justify-items: end;
      }
      .logo {
        height: 90px;
        margin-left: 30px;
        margin-top: 15px;
      }
      .header-title {
        margin-right: 30px;
        cursor: pointer;
        color: #81ac63;
      }
      .header-title:hover {
        color: #e9d375;
        transition: color 0.3s ease;
      }
    </style>
  </head>
  <body>
    <img class="pig" src="welcome to alaska.jpg" alt="welcome to alaska" />
  </body>
</html>
